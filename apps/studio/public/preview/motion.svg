<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <rect width="1080" height="720" fill="#12110f"/>
  <circle cx="360" cy="360" r="140" fill="#7fa892">
    <animate attributeName="cx" values="280;800;280" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="120;180;120" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="360" r="90" fill="#d4a84b" fill-opacity="0.85">
    <animate attributeName="cy" values="220;500;220" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="560" width="1080" height="160" fill="#1a1916"/>
  <text x="48" y="620" fill="#f2efe8" font-family="Georgia, serif" font-size="36">Pulse Study</text>
  <text x="48" y="660" fill="#a39e93" font-family="sans-serif" font-size="18">animated — 3:2</text>
</svg>
